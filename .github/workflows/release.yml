name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example: 1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${REF_NAME#refs/tags/v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.0-9A-Za-z]+)?$ ]]; then
            echo "::error::Invalid release version: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Sync version into cwplugin.json
        # cwplugin.json 的 version 会写进打包产物，这里按 tag 同步，
        # 避免仓库里的版本号落后于 tag。仅作用于打包产物，不提交回仓库。
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("cwplugin.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["version"] = os.environ["VERSION"]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("cwplugin.json version ->", d["version"])
          PY

      - name: Build plugin packages
        shell: bash
        run: |
          # Build .cwplugin format
          cw-plugin-pack
          # Build .zip format
          cw-plugin-pack --format zip

      # 本仓库是修改版，只发 GitHub Release，不发布到插件广场。
      # 如需恢复：加回 `cw-plugin-publish` 步骤并配置 CWPT_TOKEN secret，
      # 注意插件 ID com.helloswx.weather 与原版相同，发布会撞上原版的广场条目。

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}"
          git push origin "${TAG}"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog with git-cliff
        shell: bash
        run: |
          git-cliff --config .git-cliff.toml --tag "v${{ steps.version.outputs.version }}" --output CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body_path: CHANGELOG.md
          generate_release_notes: false
