name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true
      version:
        description: "Release version without the v prefix (for example: 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install git-cliff
        run: |
          cargo install git-cliff

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Build plugin packages
        run: |
          # Build .cwplugin format
          cw-plugin-pack
          # Build .zip format
          cw-plugin-pack --format zip

      - name: Publish to plugin registry
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          fi

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: v${{ env.VERSION }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}"
          git push origin "${TAG}"

      - name: Generate changelog with git-cliff
        id: generate_changelog
        shell: bash
        run: |
          git-cliff --config .git-cliff.toml --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
