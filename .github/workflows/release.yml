name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true
      version:
        description: "Release version without the v prefix (for example: 1.0.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Sync version into cwplugin.json
        # cwplugin.json 的 version 才是发布到广场、写进包内的版本，
        # 这里按 tag 同步，避免仓库里的版本号落后于 tag。仅作用于打包产物，不提交回仓库。
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("cwplugin.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["version"] = os.environ["VERSION"]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("cwplugin.json version ->", d["version"])
          PY

      - name: Build plugin packages
        run: |
          # Build .cwplugin format
          cw-plugin-pack
          # Build .zip format
          cw-plugin-pack --format zip

      - name: Publish to plugin registry
        # Tag 推送时始终发布；手动触发时由 publish 开关控制
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish

      - name: Create and push version tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: v${{ steps.version.outputs.value }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${TAG}" --message "Release ${TAG}"
          git push origin "${TAG}"

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .git-cliff.toml
          args: --tag v${{ steps.version.outputs.value }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Release v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ steps.changelog.outputs.content }}
          generate_release_notes: false
